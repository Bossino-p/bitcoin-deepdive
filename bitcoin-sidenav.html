  ██████████████████████████████████████████████████████

  HOW TO INTEGRATE:
  1. Paste the <style> block into the page <head>
  2. Paste the <nav> element just before </body>
  3. Paste the <script> block just before </body> after the nav
  4. Ensure each section has the correct id attribute:
       #hero, #origin, #timeline, #mechanics,

  ██████████████████████████████████████████████████████

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Nav — Component Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════
     PASTE INTO PAGE <head>
     ═══════════════════════════════════════════════════ -->
<style>
  :root {
    --btc:       #F7931A;
    --btc-dim:   #a85e08;
    --btc-glow:  rgba(247,147,26,.18);
    --ink:       #0a0a0a;
    --ink-2:     #111111;
    --ink-3:     #1a1a1a;
    --muted:     rgba(255,255,255,.38);
    --faint:     rgba(255,255,255,.12);
    --text:      rgba(255,255,255,.92);
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ink); color: var(--text); }

  /* ── SIDEBAR WRAPPER ──────────────────────────────────── */
  .sidenav {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;

    /* collapsed state — dots only */
    width: 28px;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;

    /* fade in after hero via JS class */
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
  }

  .sidenav.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* expanded state on hover */
  .sidenav:hover,
  .sidenav:focus-within {
    width: auto;
    align-items: flex-start;
  }

  /* subtle left-edge track */
  .sidenav::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent,
      var(--faint) 20%,
      var(--faint) 80%,
      transparent
    );
    pointer-events: none;
    transition: opacity .3s;
  }

  .sidenav:hover::before { opacity: 0; }

  /* ── NAV ITEM ─────────────────────────────────────────── */
  .sidenav-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    cursor: pointer;
    text-decoration: none;
    padding-left: 8px;

    /* collapsed: only the dot takes space */
    width: 20px;
    overflow: visible;
    transition: width .25s ease;
  }

  .sidenav:hover .sidenav-item,
  .sidenav:focus-within .sidenav-item {
    width: auto;
    gap: 10px;
  }

  /* ── ITEM LABEL ───────────────────────────────────────── */
  .sidenav-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;

    /* hidden until hover */
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .2s ease, transform .2s ease, color .2s ease;
    pointer-events: none;
  }

  .sidenav:hover .sidenav-label,
  .sidenav:focus-within .sidenav-label {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }

  .sidenav-item:hover .sidenav-label,
  .sidenav-item.active .sidenav-label {
    color: var(--text);
  }

  /* stagger label reveal per item */
  .sidenav-item:nth-child(1)  .sidenav-label { transition-delay: .00s; }
  .sidenav-item:nth-child(2)  .sidenav-label { transition-delay: .02s; }
  .sidenav-item:nth-child(3)  .sidenav-label { transition-delay: .04s; }
  .sidenav-item:nth-child(4)  .sidenav-label { transition-delay: .06s; }
  .sidenav-item:nth-child(5)  .sidenav-label { transition-delay: .08s; }
  .sidenav-item:nth-child(6)  .sidenav-label { transition-delay: .10s; }
  .sidenav-item:nth-child(7)  .sidenav-label { transition-delay: .12s; }
  .sidenav-item:nth-child(8)  .sidenav-label { transition-delay: .14s; }
  .sidenav-item:nth-child(9)  .sidenav-label { transition-delay: .16s; }

  /* ── DOT ──────────────────────────────────────────────── */
  .sidenav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--faint);
    border: 1px solid rgba(255,255,255,.2);
    flex-shrink: 0;
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }

  .sidenav-item:hover .sidenav-dot {
    background: var(--muted);
    transform: scale(1.3);
  }

  .sidenav-item.active .sidenav-dot {
    background: var(--btc);
    border-color: var(--btc-dim);
    transform: scale(1.4);
    box-shadow: 0 0 0 2px var(--ink), 0 0 6px var(--btc-glow);
  }

  /* ── SECTION NUMBER (tiny, beside dot when expanded) ─── */
  .sidenav-num {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: .1em;
    color: rgba(255,255,255,.18);
    white-space: nowrap;

    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .2s ease .06s, transform .2s ease .06s;
    pointer-events: none;
    order: 1; /* appears after the dot on left side */
  }

  .sidenav:hover .sidenav-num,
  .sidenav:focus-within .sidenav-num {
    opacity: 1;
    transform: translateX(0);
  }

  .sidenav-item.active .sidenav-num { color: var(--btc-dim); }

  /* ── SCROLL PROGRESS LINE ─────────────────────────────── */
  /* thin line that grows from top to bottom as user scrolls */
  .sidenav-progress {
    position: absolute;
    left: 13px;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--faint);
    overflow: hidden;
    border-radius: 1px;
    pointer-events: none;
  }

  .sidenav-progress-fill {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0%;
    background: linear-gradient(to bottom, var(--btc-dim), var(--btc));
    border-radius: 1px;
    transition: height .1s linear;
  }

  /* ── MOBILE — hide sidebar on small screens ───────────── */
  @media (max-width: 768px) {
    .sidenav { display: none; }
  }
</style>
</head>
<body>

<!-- preview scaffold — remove from final page -->
<div style="height:100vh;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:.1em">

<!-- ═══════════════════════════════════════════════════
     PASTE JUST BEFORE </body>
     ═══════════════════════════════════════════════════ -->
<nav class="sidenav" id="sidenav" aria-label="Page sections">

  <!-- scroll progress track -->
  <div class="sidenav-progress" aria-hidden="true">
    <div class="sidenav-progress-fill" id="sidenav-progress-fill"></div>
  </div>

  <a class="sidenav-item" href="#hero" aria-label="Hero section">
    <span class="sidenav-dot"></span>
    <span class="sidenav-num">01</span>
    <span class="sidenav-label">The Manifesto</span>
  </a>

  <a class="sidenav-item" href="#origin" aria-label="Origin story section">

  <a class="sidenav-item" href="#timeline" aria-label="Timeline section">

  </a>

  <a class="sidenav-item" href="#mechanics" aria-label="How it works section">
    <span class="sidenav-dot"></span>
    <span class="sidenav-num">04</span>
    <span class="sidenav-label">How It Works</span>
  </a>

  <a class="sidenav-item" href="#tokenomics" aria-label="Tokenomics section">
    <span class="sidenav-dot"></span>
    <span class="sidenav-num">05</span>
    <span class="sidenav-label">Tokenomics</span>
  </a>

  <a class="sidenav-item" href="#upgrades" aria-label="Technical upgrades section">

  <a class="sidenav-item" href="#custody" aria-label="Self-custody section">

  <a class="sidenav-item" href="#risks" aria-label="Risk matrix section">

<!-- ═══════════════════════════════════════════════════
     PASTE JUST BEFORE </body>, AFTER THE <nav>
     ═══════════════════════════════════════════════════ -->
<script>
(function () {
  const nav       = document.getElementById('sidenav');
  const fill      = document.getElementById('sidenav-progress-fill');
  const items     = nav.querySelectorAll('.sidenav-item');
  const heroEl    = document.getElementById('hero');

  // section ids in order — must match the href values above
  const sectionIds = [
    'hero','origin','timeline','mechanics',
    'tokenomics','upgrades','custody','risks','reads','meaning'
  ];

  // cache section elements (gracefully skip missing ones during build)
  const sections = sectionIds.map(id => document.getElementById(id)).filter(Boolean);

  // ── Show/hide sidebar after user scrolls past hero ────────
  function updateVisibility() {
    if (!heroEl) { nav.classList.add('visible'); return; }
    const heroBottom = heroEl.getBoundingClientRect().bottom;
    if (heroBottom < 80) {
      nav.classList.add('visible');
    } else {
      nav.classList.remove('visible');
    }
  }

  // ── Scroll progress fill ──────────────────────────────────
  function updateProgress() {
    const scrollTop    = window.scrollY;
    const docHeight    = document.documentElement.scrollHeight - window.innerHeight;
    const pct          = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    if (fill) fill.style.height = pct.toFixed(1) + '%';
  }

  // ── Active section detection ──────────────────────────────
  function updateActive() {
    let activeIndex = 0;
    const mid = window.innerHeight * 0.4; // trigger at 40% from top

    sections.forEach((section, i) => {
      const rect = section.getBoundingClientRect();
      if (rect.top <= mid) activeIndex = i;
    });

    items.forEach((item, i) => {
      // map item index to section — items may outnumber loaded sections
      const sectionIndex = i < sections.length
        ? sectionIds.indexOf(sections[i]?.id)
        : -1;

      if (i === activeIndex) {
        item.classList.add('active');
        item.setAttribute('aria-current', 'true');
      } else {
        item.classList.remove('active');
        item.removeAttribute('aria-current');
      }
    });
  }

  // ── Smooth scroll on click (overrides anchor jump) ────────
  items.forEach(item => {
    item.addEventListener('click', e => {
      const href = item.getAttribute('href');
      if (!href || !href.startsWith('#')) return;
      const target = document.querySelector(href);
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // ── Scroll handler ────────────────────────────────────────
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        updateVisibility();
        updateProgress();
        updateActive();
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  // ── Initial state ─────────────────────────────────────────
  updateVisibility();
  updateProgress();
  updateActive();
})();
</script>

</body>
</html>
